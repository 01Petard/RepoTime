
name: Daily RepoTime Redeploy

on:
  schedule:
    - cron: '10 0 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redeploy:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing VERCEL_DEPLOY_HOOK secret"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --request POST \
            "$DEPLOY_HOOK" > /dev/null

          echo "Vercel deployment requested successfully."
